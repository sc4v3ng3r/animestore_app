name: anime_app
description: A flutter anime watch app
publish_to: none

version: 1.5.0

environment:
  sdk: ">=2.14.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.3
  anitube_crawler_api:
    path: ../Anitube_Crawler_API

  provider: ^5.0.0
  cached_network_image: ^3.1.0
  video_player: ^2.1.1
  carousel_pro_nullsafety: ^1.0.2
  wakelock: ^0.5.1
  random_color: ^1.0.6-nullsafety
  sqflite: ^2.0.0+2
  path: ^1.8.0
  bot_toast: ^4.0.0+1
  flutter_svg: ^0.23.0+1
  mobx: ^2.0.5
  flutter_mobx: ^2.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.17.0
  package_info: ^2.0.0
  dio:

dev_dependencies:
  mobx_codegen: ^2.0.4
  build_runner: ^2.1.4
  flutter_test:
    sdk: flutter
  test: any

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/font/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Black.ttf
        - asset: assets/font/Poppins-Bold.ttf
        - asset: assets/font/Poppins-Regular.ttf

flutter_intl:
  enabled: true